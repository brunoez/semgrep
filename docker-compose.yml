version: '3.8'

services:
  semgrep-visualizer:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: semgrep_visualizer_prod
    restart: always
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
