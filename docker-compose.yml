version: '3.8'

services:
  semgrep-visualizer:
    image: ghcr.io/brunoez/semgrep:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: semgrep_visualizer_prod
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
